name: RankingHolograms
version: '${version}'
main: com.silvera.rankingholograms.RankingHologramsPlugin
api-version: '1.21'
description: FancyHolograms placeholder'lari ile Top 10 siralama hologramlari, SimpleClans entegrasyonlu.
author: YukileX
depend: [SimpleClans, FancyHolograms]
softdepend: [PlaceholderAPI, CataMines]

commands:
  siralama:
    description: Siralama yonetimi (liste, reload).
    aliases: [sıralamahologramayarla]
    permission: rankhologram.admin

permissions:
  rankhologram.admin:
    description: Tum admin komutlarina erisim.
    default: op
  rankhologram.reload:
    description: Eklentiyi yeniden yukleme yetkisi.
    default: op
