name: RankingHolograms
version: '${version}'
main: com.silvera.rankingholograms.RankingHologramsPlugin
api-version: '1.21'
description: Citizens NPC tabanli siralama hologramlari, SimpleClans entegrasyonlu.
author: YukileX
depend: [SimpleClans, Citizens]

commands:
  npcselect:
    description: Yakindaki bir Citizens NPC'sini secili hale getirir (RankingHolograms takibi icin).
    permission: rankhologram.create

  npchologramdurdur:
    description: Secili NPC'nin hologramini/donusunu baktigin yone kilitler, tekrar yazinca acar.
    permission: rankhologram.create

  killsiralama1:
    description: Kill siralamasinda 1. siradaki kisiyi secili NPC'ye hologram olarak baglar.
    aliases: [killsıralama1]
    permission: rankhologram.create
  killsiralama2:
    description: Kill siralamasinda 2. siradaki kisiyi secili NPC'ye hologram olarak baglar.
    aliases: [killsıralama2]
    permission: rankhologram.create
  killsiralama3:
    description: Kill siralamasinda 3. siradaki kisiyi secili NPC'ye hologram olarak baglar.
    aliases: [killsıralama3]
    permission: rankhologram.create

  zamansiralama1:
    description: Zaman siralamasinda 1. siradaki kisiyi secili NPC'ye hologram olarak baglar.
    aliases: [zamansıralama1]
    permission: rankhologram.create
  zamansiralama2:
    description: Zaman siralamasinda 2. siradaki kisiyi secili NPC'ye hologram olarak baglar.
    aliases: [zamansıralama2]
    permission: rankhologram.create
  zamansiralama3:
    description: Zaman siralamasinda 3. siradaki kisiyi secili NPC'ye hologram olarak baglar.
    aliases: [zamansıralama3]
    permission: rankhologram.create

  olumsiralama1:
    description: Olum siralamasinda 1. siradaki kisiyi secili NPC'ye hologram olarak baglar.
    aliases: [ölümsıralama1]
    permission: rankhologram.create
  olumsiralama2:
    description: Olum siralamasinda 2. siradaki kisiyi secili NPC'ye hologram olarak baglar.
    aliases: [ölümsıralama2]
    permission: rankhologram.create
  olumsiralama3:
    description: Olum siralamasinda 3. siradaki kisiyi secili NPC'ye hologram olarak baglar.
    aliases: [ölümsıralama3]
    permission: rankhologram.create

  klansiralama1:
    description: Klan siralamasinda 1. siradaki klani secili NPC'ye hologram olarak baglar.
    aliases: [klansıralama1]
    permission: rankhologram.create
  klansiralama2:
    description: Klan siralamasinda 2. siradaki klani secili NPC'ye hologram olarak baglar.
    aliases: [klansıralama2]
    permission: rankhologram.create
  klansiralama3:
    description: Klan siralamasinda 3. siradaki klani secili NPC'ye hologram olarak baglar.
    aliases: [klansıralama3]
    permission: rankhologram.create

  killsiralamatop3:
    description: Kill siralamasinda ilk 3 kisi + toplam kill'i secili NPC'ye tek hologram olarak baglar.
    aliases: [killsıralamatop3]
    permission: rankhologram.create
  zamansiralamatop3:
    description: Zaman siralamasinda ilk 3 kisi + toplami secili NPC'ye tek hologram olarak baglar.
    aliases: [zamansıralamatop3]
    permission: rankhologram.create
  olumsiralamatop3:
    description: Olum siralamasinda ilk 3 kisi + toplami secili NPC'ye tek hologram olarak baglar.
    aliases: [ölümsıralamatop3]
    permission: rankhologram.create
  klansiralamatop3:
    description: Klan siralamasinda ilk 3 klan + toplam kill'i secili NPC'ye tek hologram olarak baglar.
    aliases: [klansıralamatop3]
    permission: rankhologram.create

  siralama:
    description: Siralama hologram yonetim menusu (baglantiyi kaldirma, reload).
    aliases: [sıralamahologramayarla]
    permission: rankhologram.admin

permissions:
  rankhologram.admin:
    description: Tum admin komutlarina erisim.
    default: op
  rankhologram.create:
    description: NPC secme ve hologram baglama yetkisi.
    default: op
  rankhologram.remove:
    description: Hologram baglantisini kaldirma yetkisi.
    default: op
  rankhologram.reload:
    description: Plugin reload yetkisi.
    default: op
