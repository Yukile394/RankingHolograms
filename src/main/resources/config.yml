hologram:
  # Siralamalarin yenilenme ve hologram satirlarinin guncellenme araligi (saniye).
  update-interval: 5
  # Cevrimici oyuncularin sure verisinin veritabanina yazilma araligi (saniye).
  time-flush-seconds: 60

database:
  type: sqlite
  file: data.db

placeholders:
  # Bos siralama pozisyonlarinda gosterilir. &-renk kodlari kullanilabilir.
  empty-name: "-"      # %killed7% vb.
  empty-value: "0"     # %killed7_deger% vb.

messages:
  no-permission: "<red>Bu komutu kullanma yetkin yok."
  empty-leaderboard: "<red>Bu sirada henuz yeterli veri yok."
  unknown-category: "<red>Kategori: killed, zaman, olum veya klan."
  reload-success: "<green>Yapilandirma yeniden yuklendi."
  fancyholograms-missing: "FancyHolograms bulunamadi, eklenti devre disi birakiliyor."
  fancyholograms-api-error: "FancyHolograms API'si cozumlenemedi, eklenti devre disi birakiliyor."
  simpleclans-missing: "SimpleClans bulunamadi, eklenti devre disi birakiliyor."
