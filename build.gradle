plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'com.silvera'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://mvn.lumine.io/repository/maven-public/' }
    maven { url = 'https://repo.roinujnosde.me/releases/' } // Actively maintained SimpleClans fork (RoinujNosde)
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'

    // SimpleClans API (hard dependency at runtime, compileOnly here since it is provided by the server).
    // Check https://repo.roinujnosde.me/releases/net/sacredlabyrinth/phaed/simpleclans/SimpleClans/
    // for the latest version number before building.
    compileOnly 'net.sacredlabyrinth.phaed.simpleclans:SimpleClans:2.19.2'

    // Database driver + connection pool, shaded into the final jar
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'com.zaxxer:HikariCP:5.1.0'
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set('')
}

build {
    dependsOn shadowJar
}
